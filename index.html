<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Inicial</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #111111;
    }

    ul {
      list-style: none;
      text-align: center;
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: bold;
      line-height: 1.4;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <ul>
    <li>Jonil de Morais</li>
    <li>Maria de Jesus</li>
    <li>Shrek Rex</li>
  </ul>
</body>
</html>
